# Serves the application under its own URL prefix, because these projects are deployed that way
# and the prefix is baked into their configuration. ADI's SRC_DIRECTORY=/adi means every asset
# path, redirect and cookie path it generates carries /adi; serving at / would 404 all of them
# and the audit would spend its time on broken links instead of on the application.
#
# The prefix is substituted by entrypoint.sh, which knows SRC_DIRECTORY.
<VirtualHost *:80>
    DocumentRoot /var/www/html
    AcceptPathInfo On

    <Directory /var/www/html>
        Options FollowSymLinks
        # THE line. Without AllowOverride All, Apache ignores every .htaccess in the tree: the
        # application 404s on every page because its routing lives there, AND — the part that
        # matters more — the .htaccess rules that deny access to .env, app/ and vendor/ stop
        # applying, so `curl http://host/adi/.env` returns the file with every password in it.
        # ADI's own DEPLOY.md marks this as critical. A recipe that got it wrong would produce
        # an audit of a differently-broken application.
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    # NOTHING IS HARDENED BEYOND THIS POINT, DELIBERATELY.
    #
    # The temptation is to add `<DirectoryMatch "/\.git">Require all denied</DirectoryMatch>`,
    # and it was in this file for a few minutes. It is wrong. A previous manual audit of ADI
    # found the entire .git directory downloadable over HTTP from the real server — the rule
    # their .htaccess ships, `<FilesMatch "^\.">`, matches FILES starting with a dot and not
    # the CONTENTS of a directory called .git. If the lab quietly patches that, the scan comes
    # back clean and a critical, verified, live exposure disappears from the report.
    #
    # An audit that hardens its own copy is not measuring the application; it is measuring the
    # lab. Rung 3 exists to reproduce the deployment faithfully, and faithfully includes its
    # defects. Lying in the safe direction is still lying, and it is the more dangerous
    # direction here because the result looks like good news.
    #
    # Containment comes from the environment, not from the configuration: this port is bound to
    # 127.0.0.1, the data is synthetic, and `make down` destroys the whole thing.

    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
