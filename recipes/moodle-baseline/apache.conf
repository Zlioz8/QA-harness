# Serves the Moodle tree under /zajuna, exactly as the platform does.
#
# Not at the document root, even though that would be simpler: every URL stored in the database
# — pluginfile links, course summaries, the plugin's own generated links — carries the /zajuna
# prefix. Serving at / would make each of those a 404 and the audit would spend its time on
# broken links instead of on the application.
<VirtualHost *:80>
    DocumentRoot /var/www/html
    Alias /zajuna /var/www/html/zajuna
    AcceptPathInfo On

    <Directory /var/www/html/zajuna>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
