# RECIPE: a FastAPI service run by uvicorn, from a subdirectory of the audited repo.
#
# The source is read-only, so the code is copied into a writable path before installing
# dependencies — the audited tree never gains a .venv or a __pycache__ because of us.
services:
  api:
    profiles: ["runtime", "dast", "perf", "e2e"]
    image: ${PYTHON_IMAGE:-python:3.11-slim}
    volumes:
      - ${SRC_PATH}:/src:ro
      # Relative to THIS file's directory, not the project root (see the note in postgres.yml).
      - ../targets/${TARGET_NAME}/api.env:/api.env:ro
    working_dir: /app
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "127.0.0.1:${API_PORT:-8030}:8030"
    # API_SUBDIR: path of the service inside the repo. API_MODULE: uvicorn target (e.g. main:app).
    # REQUIREMENTS: which requirements file to install (services often share one at repo root).
    # Keep each shell command on ONE line: in a YAML folded scalar (>) a more-indented line
    # keeps its newline instead of being folded, which silently splits the command in two.
    command: >
      sh -c "cp -a /src/${API_SUBDIR}/. /app/ &&
      cp /api.env /app/.env 2>/dev/null || true;
      pip install --no-cache-dir --root-user-action=ignore uvicorn fastapi -r /src/${REQUIREMENTS:-requirements.txt} &&
      uvicorn ${API_MODULE:-main:app} --host 0.0.0.0 --port 8030"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8030${API_HEALTH_PATH:-/health}').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
