# El registro de dimensiones — la ÚNICA lista de lo que este laboratorio sabe hacer.
#
# Por qué existe: la misma lista estaba escrita SEIS veces (los goals del Makefile, los bloques de
# umbral de tools/gate.sh, la tabla chk() de tools/run-manifest.sh, la lista dims de
# tools/dashboard.py, SOURCES de ui/findings.py y las sources de _triage_blocks en ui/app.py).
# Añadir una dimensión eran seis ediciones, y olvidar una no daba error: daba un fallo silencioso.
#
# Ya había derivado. Medido antes de escribir esto:
#   - ui/app.py leía zap/zap-report.json mientras ui/findings.py leía zap/zap.sarif. En
#     anuncios_de_plataforma el primero es formato ZAP crudo (clave "site", sin "runs"), así que
#     load_sarif() devolvía None y la pantalla de triaje omitía ZAP ENTERO, en silencio.
#   - _triage_blocks no incluía sonar, qodana, api-lint ni mobsf; findings.py no incluía mobsf.
#     Hallazgos reales que no se podían juzgar desde una de las dos pantallas.
#
# FORMATO: claves planas, un nivel, sin anclas ni bloques multilínea. Es deliberado —
# tools/dimensions.py lo parsea con la biblioteca estándar, porque PyYAML no es dependencia del
# laboratorio y no va a serlo por una lista de dieciocho entradas.
#
# CAMPOS
#   id         identificador corto. Es la clave del triaje (triage.key_for) y el nombre del test
#              en DefectDojo. NO cambiarlo: rompe los veredictos ya registrados.
#   label      lo que lee una persona. En español, como el resto de la interfaz.
#   goal       el goal del Makefile que la produce. La UI lo usa para el botón.
#   kind       cómo se lee el artefacto. findings | verdict | metrics | junit | sbom | manual
#              Nace con los seis valores aunque hoy solo se usen dos: cambiar el esquema después
#              obligaría a reescribir a los seis consumidores otra vez.
#   artifact   UNA ruta canónica bajo reports/<target>/. Una sola. El bug de ZAP fue exactamente
#              tener dos, y que cada consumidor eligiera la suya.
#   script     EL GUION: el archivo que la HERRAMIENTA INTERPRETA, relativo a targets/<t>/.
#              Vacío = esta herramienta no lleva guion (apuntas al árbol y ya: trivy, syft,
#              trufflehog). Puede llevar ${VAR}: el plan de JMeter y el script de k6 se eligen
#              desde el perfil.
#
#              ES EL TECHO DE LA COBERTURA, no solo una entrada más. Medido: antiplagio corrió
#              la carga con k6/smoke.js, TRES peticiones, y el informe dice «Carga: p95 30ms
#              PASS» — verdad, y casi sin significado. costos_web tiene diez guiones de carga
#              (stress_ramp, capacity_multiuser, import_stress…). Hoy las dos se pintan igual.
#              Por eso el guion tiene que verse, con su alcance, junto a la dimensión.
#   script_kind  qué ES ese archivo, para que se lea sin abrirlo:
#              plan | script | specs | reglas | config
#   object     LO AUDITADO cuando no es el código: el binario firmado, una imagen construida, el
#              documento OpenAPI. Ni ajuste ni guion — es el sujeto. Sin él la dimensión no
#              tiene sobre qué operar, y eso es NO DISPONIBLE, no «sin hallazgos».
#   inputs     QUÉ le pide esta dimensión al operador, en claves de target.env, separadas por
#              comas. Un `|` entre dos claves significa "una u otra basta". Es lo que permite que
#              la interfaz muestre, antes de correr nada, qué falta por rellenar para cada
#              herramienta — la primera columna del diagrama: entrada -> herramienta -> salida.
#   gate       la clave de target.env que fija el umbral. Vacío = la dimensión no juzga.
#   default    el valor que gate.sh usaba inline cuando el perfil no declara la clave. Se registra
#              aquí para no perderlo; que se AVISE de que es un defecto no declarado es fase 2.
#   live       necesita la aplicación respondiendo (peldaño 2+).
#   triage     aparece en las pantallas de juicio humano.
#   class      presupuesto de recursos: light | server | browser | load    (ver `mem`)
#   mem        techo de memoria. Se convierte en mem_limit del servicio compose.
#   measured   si `mem` sale de medir con `docker stats` o es una estimación. NO se miente aquí:
#              hoy solo ZAP tiene número medido (2g, tras un pico real de 7,59 GiB que congeló la
#              máquina y provocó un OOM sobre el editor — ver docker-compose.yml:234-241).
#              tools/admit.sh trata `false` como estimación y lo dice.
#   needs      qué tiene que tocar para funcionar: source | target-network | nothing | device
#              Es lo que decide si la dimensión puede moverse a otro servidor, y no es balanceo de
#              carga: mandar 2,78 GB de node_modules a un runner remoto es peor que analizarlo
#              aquí. `nothing` = es un servicio REST, su host es una variable y puede vivir donde
#              sea (sonarqube y mobsf ya son así hoy).
#   runner     dónde se ejecuta. Hoy SOLO se implementa `local`; los demás valores están
#              documentados y sin implementar a propósito, para que tools/run-dimension.sh sea la
#              única indirección que haya que tocar el día que llegue el segundo servidor.
#              local | ssh://host | context:nombre | url:https://...

