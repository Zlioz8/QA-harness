# SonarQube project descriptor (native config — no script) para analitica_notificaciones.
sonar.projectKey=analitica_notificaciones
sonar.projectName=analitica_notificaciones (audit)

# EL SUJETO ES EL REPOSITORIO, NO EL DIRECTORIO PADRE.
#
# Sonar es `needs: nothing` (un servidor), así que NO pasa por el acotado por-repo de
# tools/run-dimension.sh: docker-compose.yml monta ${SRC_PATH} —el directorio PADRE— en
# /usr/src, y projectBaseDir es ese padre. Con `sonar.sources=.` Sonar indexaría también el
# manual en .docx, las capturas y .playwright-mcp/ (logs de OTRO proyecto). No suele producir
# issues, pero infla lo que Sonar dice haber analizado — y la cobertura del informe tiene que
# ser exacta. Se apunta sources al repositorio descubierto, que es el único sujeto de esta
# auditoría. Si el proyecto tuviera varios repos, se listarían separados por coma.
sonar.sources=analitica_notificaciones
sonar.sourceEncoding=UTF-8

# Nunca terceros ni artefactos de construcción, y el ruido propio de este repo: bytecode
# versionado, copias de consultas y pruebas sin filtros.
sonar.exclusions=**/vendor/**,**/node_modules/**,**/dist/**,**/build/**,**/*.min.js,**/__pycache__/**,**/.venv/**,**/*.pyc,**/api/sql/copias/**,**/pruebas_sql/**

# Los lenguajes que este proyecto usa de verdad: Python (FastAPI), PHP (plugin Moodle), JS (frontend sin build).
sonar.python.file.suffixes=.py
sonar.php.file.suffixes=php
sonar.javascript.file.suffixes=.js
