# Runtime para anuncios_de_plataforma — RONDA 2.
#
# QUÉ CAMBIÓ RESPECTO A LA RONDA 1, Y POR QUÉ IMPORTA PARA LEER LAS CIFRAS.
#
# En la ronda 1 este archivo CONSTRUÍA el blanco: incluía recipes/moodle-baseline.yml, que
# levantaba un Moodle efímero en :8083 con la línea base de la plataforma y le instalaba los
# dos plugins. Era la única forma de apuntar un escáner a un plugin, que por sí solo no tiene
# punto de entrada.
#
# En la ronda 2 el blanco EXISTE y no lo gobierna el laboratorio: el plugin se desplegó en el
# Zajuna bare metal de esta máquina siguiendo slider_form/DEPLOY.md §10 (nginx 1.24 +
# php8.1-fpm pool zajuna + PostgreSQL 16, Moodle 4.3.3+ en /var/www/zajuna). Por tanto:
#
#   · Se retira el `include` de la receta. Dejarlo levantaría un SEGUNDO Moodle en :8083 y nada
#     diría cuál de los dos contestó — el collage de procedencias que este laboratorio existe
#     para no producir. La receta NO se borra: sigue en recipes/ y la ronda 1 se midió con ella.
#   · PERF_CPUS / PERF_MEM ya NO se aplican: no hay `deploy.resources.limits` sobre un servicio
#     del sistema. RUN.md debe decir que el envelope declarado no está impuesto, o las cifras de
#     carga parecerán comparables cuando no lo son.
#   · Las cabeceras de seguridad SÍ son atribuibles ahora: las emite el nginx de la plataforma,
#     no el php:8.2-apache del laboratorio. El descuento que hacía la ronda 1 ya no aplica.

services:
  # ZAP en la red del HOST, igual que en la ronda 1 y por la misma razón de fondo: Moodle impone
  # su wwwroot y responde 303 a toda petición cuyo Host no coincida. Aquí el wwwroot es
  # https://nginx.zajuna.com/zajuna, que sólo resuelve por el /etc/hosts del anfitrión.
  #
  # `network_mode: host` da a ZAP la pila de red del anfitrión, pero NO su /etc/hosts: docker
  # inyecta el suyo. Sin `extra_hosts`, nginx.zajuna.com no resuelve dentro del contenedor, ZAP
  # aborta con "unknown host" y el informe sale vacío pero existiendo — la peor combinación,
  # porque parece que se midió.
  zap:
    network_mode: host
    extra_hosts:
      - "nginx.zajuna.com:127.0.0.1"

  # Mismo razonamiento para k6: necesita resolver el wwwroot exacto o mediría redirecciones.
  # El certificado es autofirmado; K6_INSECURE_SKIP_TLS_VERIFY=true está declarado en target.env
  # (sin él k6 aborta el 100% de las peticiones y el informe lo pinta como fallo de la app).
  k6:
    extra_hosts:
      - "nginx.zajuna.com:host-gateway"

  # Playwright ya corre con network_mode: host en el núcleo; hereda el /etc/hosts de docker,
  # así que necesita la misma entrada.
  playwright:
    extra_hosts:
      - "nginx.zajuna.com:127.0.0.1"
