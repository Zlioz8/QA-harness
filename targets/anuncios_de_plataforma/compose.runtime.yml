# Runtime for anuncios_de_plataforma — rung 3, composed from recipes.
#
# `local_slider` and `local_slider_form` are Moodle plugins: they have no entry point of their
# own, so there is nothing to point a scanner at until a Moodle exists around them. This file
# builds that Moodle, ephemeral and reproducible, and destroys it with `make down`.
#
# PLUGIN_SUBDIR is the repository ROOT here, not a single plugin directory: the recipe's install
# hook finds every version.php and derives each plugin's destination from its own
# `$plugin->component`, so both plugins are installed and upgraded by Moodle itself.
#
# What this deliberately does NOT do: seed content. An empty Moodle answers every plugin screen
# with "nothing to show", and a DAST run against empty screens finds an empty application. The
# seeded scenario is the next input the operator owes this profile — see targets/antiplagio for
# the shape of one (seed-users.sh).

# include paths resolve against the PROJECT directory (the lab root), not against this file.
# NOT recipes/postgres.yml: moodle-baseline.yml brings its own `db`, because the baseline's
# restore and neutering run from that container's init hooks. Including both would define the
# service twice and compose would silently merge them into something neither recipe describes.
include:
  - path: ./recipes/moodle-baseline.yml

services:
  # ZAP en la red del HOST, sólo para este perfil.
  #
  # Moodle impone su wwwroot: cualquier petición cuyo Host no coincida recibe una redirección
  # 303 hacia él. Con ZAP en la red del compose, pedir http://moodle:80/zajuna devuelve un
  # redirect a http://localhost:8083 — y "localhost" dentro del contenedor de ZAP es ZAP, no
  # Moodle. El spider muere con "Connection refused" y el informe sale vacío pero existiendo,
  # que es la peor combinación: parece que se midió.
  #
  # En la red del host, localhost:8083 significa lo mismo para ZAP que para el navegador, así
  # que la redirección de Moodle resuelve. Es la misma razón por la que playwright usa
  # network_mode: host. No se toca el servicio zap del núcleo: otros perfiles apuntan a un
  # contenedor por nombre de servicio y allí la red del compose es la correcta.
  zap:
    network_mode: host
