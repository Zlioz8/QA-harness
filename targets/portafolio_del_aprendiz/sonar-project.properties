# SonarQube — guion escrito para local_portafolio @ feature/v2 9674bda.
#
# LO QUE PASÓ CON LA PLANTILLA, porque explica cada línea de abajo. La primera corrida declaró
# **0 issues**, y no era código limpio: el scanner murió con `java.lang.OutOfMemoryError: Java
# heap space` tras 5 minutos analizando `.../Qodana/qodana-cache/go/github.com/bytedance/sonic@…`.
# El SRC_PATH de este perfil es el directorio PADRE (contrato del laboratorio para multi-repo) y
# ahí, junto a los manuales, hay una carpeta `Qodana/` con 285 MB y 8.366 ficheros .go dejados por
# un análisis anterior. El scanner los tomó por el proyecto.
#
# El arreglo de fondo está en el Makefile (sonar ahora resuelve el árbol con tools/lib-repos.sh,
# como el resto de dimensiones desde L-R3-01). Estas propiedades son la segunda barrera, para que
# el guion diga por sí solo QUÉ es este proyecto y no dependa de que el montaje acierte.

sonar.projectKey=portafolio_del_aprendiz
sonar.projectName=Portafolio del Aprendiz — local_portafolio (feature/v2 @ 9674bda)
sonar.sourceEncoding=UTF-8

# 44 PHP + 2 JS. Sin `vendor/`, sin `node_modules/`, sin `dist/`: este plugin no tiene gestor de
# dependencias ni paso de build (DEPLOY.md §7 y §10), así que las exclusiones de la plantilla
# apuntaban a directorios que aquí NO EXISTEN — o sea, no excluían nada.
sonar.sources=.
sonar.php.file.suffixes=php
sonar.javascript.file.suffixes=.js

sonar.exclusions=pix/icons/fontawesome/**,**/*.min.js,**/Qodana/**,**/qodana-cache/**,**/.playwright-mcp/**

# POR QUÉ CADA EXCLUSIÓN, que es lo que la convierte en decisión y no en copia:
#
#   pix/icons/fontawesome/**, **/*.min.js
#       El único código de terceros del repositorio, minificado. Sus avisos serían de un código
#       que este equipo no escribió ni puede arreglar, y enterrarían los 46 ficheros propios.
#       Que ese bundle esté vendorizado SIN VERSIÓN DECLARADA —feature/migration traía
#       `thirdpartylibs.xml`, v2 lo perdió— sí es un hallazgo, y lo levanta la dimensión de
#       dependencias con su propia evidencia. No se silencia: se mide en otro sitio.
#
#   **/Qodana/**, **/qodana-cache/**
#       La caché que reventó la primera corrida. Cinturón y tirantes: aunque el montaje ya
#       apunte al repositorio, una exclusión explícita deja constancia de por qué está aquí.
#
#   **/.playwright-mcp/**
#       Logs de consola y de red de sesiones MCP. Aparecen en estos directorios de trabajo
#       (le pasó a analitica_notificaciones con los de OTRO proyecto) y no son código auditado.
#
# LO QUE **NO** SE EXCLUYE, a propósito:
#   cli/  — los tres scripts de siembra. El autor los marca como desechables y qodana.yaml sí los
#           excluye (ahí son estilo, no producto), pero Sonar es quien puede ver en ellos
#           inyección o manejo de datos personales, que es justo lo que interesa de esos ficheros.
