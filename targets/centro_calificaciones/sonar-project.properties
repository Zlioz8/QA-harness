# SonarQube project descriptor (native config — no script).
sonar.projectKey=centro_calificaciones
sonar.projectName=centro_calificaciones (audit)
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Never analyze third-party or build artifacts — they drown the real signal.
# Se monta el DIRECTORIO PADRE (3 repos + Historico/). DENTRO del análisis: los 3 repos
# (centro_de_actividades, centro_de_resultados, ..._sincronizacion). FUERA: Historico/ (manuales
# .md entregados, no código) y las dependencias de terceros. Declarado en RUN.md.
sonar.exclusions=Historico/**,**/vendor/**,**/node_modules/**,**/dist/**,**/build/**,**/*.min.js,**/__pycache__/**,**/.venv/**

# Uncomment the suffixes for the languages this project actually uses.
#sonar.php.file.suffixes=php
#sonar.python.file.suffixes=.py
#sonar.javascript.file.suffixes=.js,.vue
