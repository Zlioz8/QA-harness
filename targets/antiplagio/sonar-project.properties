# SonarQube project descriptor (native config — no script).
sonar.projectKey=antiplagio
sonar.projectName=Antiplagio Zajuna (audit)
sonar.sources=antiplagio,antiplagio_web,antiplagio_web_backend,antiplagio_producer_web
sonar.sourceEncoding=UTF-8

# Third-party trees, caches and test fixtures drown the signal.
sonar.exclusions=**/vendor/**,**/node_modules/**,**/__pycache__/**,**/.venv/**,**/dist/**,**/*.min.js,**/tests/samples/**,**/logs/**

# Both languages are analysed: the Moodle plugin is PHP, everything behind it is Python.
sonar.php.file.suffixes=php
sonar.python.file.suffixes=.py
sonar.javascript.file.suffixes=.js
