# SonarQube project descriptor (native config — no script).
sonar.projectKey=antiplagio
sonar.projectName=Antiplagio Zajuna (audit)
# CORREGIDO 2026-08-31: listaba antiplagio_web, antiplagio_web_backend y antiplagio_producer_web,
# que el refactor elimino de la rama dev. El scanner abortaba con "The folder 'antiplagio_web'
# does not exist" y la dimension quedaba en "0 hallazgos" — que no es un aprobado, es no medir.
# OJO: este valor NO se deriva de SOURCE_DIRS del target.env. Son dos sitios que hay que mover
# a la vez; si divergen, uno de los dos miente.
sonar.sources=antiplagio,scripts
sonar.sourceEncoding=UTF-8

# Third-party trees, caches and test fixtures drown the signal.
# report.html / report_all.html llevan EMBEBIDO un bundle minificado de browserify: no son
# codigo que el equipo escriba ni pueda mantener. Aportaban 103 de los 563 hallazgos (18%),
# incluidos los 28 de accesibilidad y 12 de los 13 "statement will not be executed
# conditionally" — todos falsos positivos que mandaban a revisar codigo de terceros.
sonar.exclusions=**/vendor/**,**/node_modules/**,**/__pycache__/**,**/.venv/**,**/dist/**,**/*.min.js,**/tests/samples/**,**/logs/**,**/report.html,**/report_all.html

# Both languages are analysed: the Moodle plugin is PHP, everything behind it is Python.
sonar.php.file.suffixes=php
sonar.python.file.suffixes=.py
sonar.javascript.file.suffixes=.js
