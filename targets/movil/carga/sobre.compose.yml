# El SOBRE de la prueba: con qué recursos y en qué configuración corre la API mientras se mide.
# Es un override del compose de movil_api; NO edita nada de ese repositorio ni su .env.
# Lo aplica y lo retira carga/sobre.sh.
#
#   SOBRE_CPUS / SOBRE_MEM   límites del contenedor (por omisión, los PERF_CPUS/PERF_MEM del perfil)
#   SOBRE_WORKERS            procesos de uvicorn. uvicorn lee WEB_CONCURRENCY por sí mismo: no hace
#                            falta tocar el comando de arranque (Dockerfile:223).
#   SOBRE_LOG_LEVEL / SOBRE_DEBUG   INFO / False son los valores por omisión del repositorio
#                            (.env.example:105-106), es decir, lo que corre un despliegue que lo siga.
#                            El .env LOCAL de esta máquina tiene DEBUG: medir con él sería medir el
#                            modo de desarrollo.
#   PROXY_HOPS=2             el generador pone la IP de cada usuario virtual en X-Forwarded-For y
#                            nginx añade la suya: con dos saltos el backend toma la del usuario
#                            (app/utils/red.py:94-110). SOLO para la prueba: en un despliegue real
#                            dejaría que cualquiera eligiera su IP.
#   SOBRE_REDIS_URL          estado compartido entre procesos (caché por persona y cupos). Por omisión
#                            el Redis del compose del repositorio; vacío (`SOBRE_REDIS_URL=`) mide la
#                            API con memoria de proceso, que es el «antes» de ese cambio.
#   SOBRE_COLAPSO            1 = un proceso espera el cálculo que otro ya hace; 0 lo apaga, para
#                            medir cuánto aporta el candado entre procesos.
services:
  web:
    cpus: ${SOBRE_CPUS:-4}
    mem_limit: ${SOBRE_MEM:-1536m}
    environment:
      - PROXY_HOPS=2
      - LOG_LEVEL=${SOBRE_LOG_LEVEL:-INFO}
      - DEBUG=${SOBRE_DEBUG:-False}
      - WEB_CONCURRENCY=${SOBRE_WORKERS:-1}
      - REDIS_URL=${SOBRE_REDIS_URL-redis://redis:6379/0}
      - ESTADO_COLAPSO=${SOBRE_COLAPSO:-1}
