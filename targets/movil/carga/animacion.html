<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zajuna Móvil bajo carga</title>
<style>
  :root { --fondo:#0b0f1a; --tinta:#e6edf3; --panel:#151b2b; --borde:#2a3550; --verde:#5df08a; --ambar:#ffcc4d; --rojo:#ff5c5c; --azul:#5cc3ff; --gris:#8892a6; }
  html,body { margin:0; background:var(--fondo); color:var(--tinta); font-family: ui-monospace, "Cascadia Mono", "Fira Mono", Menlo, monospace; }
  body { display:flex; flex-direction:column; align-items:center; gap:10px; padding:12px 16px; box-sizing:border-box; }
  h1 { font-size:16px; margin:4px 0 0; letter-spacing:1px; text-transform:uppercase; }
  .sub { color:var(--gris); font-size:12px; text-align:center; max-width:1100px; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; width:100%; max-width:1280px; border:2px solid var(--borde); background:#0e1322; }
  .barra { display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center; width:100%; max-width:1280px; font-size:12px; }
  .barra select, .barra button, .barra input[type=range] { background:var(--panel); color:var(--tinta); border:1px solid var(--borde); padding:6px 10px; font-family:inherit; font-size:12px; }
  .barra button.activo { border-color:var(--verde); color:var(--verde); }
  .barra input[type=range] { width:320px; padding:0; }
  .leyenda { font-size:11px; color:var(--gris); max-width:1280px; line-height:1.5; }
  .leyenda b { color:var(--tinta); }
  .k { display:inline-block; width:10px; height:10px; vertical-align:middle; margin-right:4px; border:1px solid #000; }
  #extras table { border-collapse:collapse; margin-top:6px; }
  #extras th, #extras td { border:1px solid var(--borde); padding:3px 8px; text-align:left; }
  #extras td.antes { color:var(--ambar); } #extras td.despues { color:var(--verde); }
</style>
</head>
<body>
<h1>Zajuna Móvil bajo carga · cómo se acumulan los retrasos</h1>
<div class="sub" id="sub">Cada número de la pantalla sale de una corrida real del laboratorio (SECURITY-LAB).</div>
<div class="barra">
  <button id="comparar" hidden>⇄ antes / después</button>
  <label id="lpareja" hidden>Escenario <select id="pareja"></select></label>
  <label id="lcorrida">Corrida <select id="corrida"></select></label>
  <button id="play" class="activo">⏸ pausa</button>
  <label>Velocidad <select id="vel"><option value="0.5">0,5×</option><option value="1">1×</option><option value="2" selected>2×</option><option value="4">4×</option><option value="10">10×</option></select></label>
  <input id="scrub" type="range" min="0" max="100" value="0">
  <span id="reloj">0 s</span>
  <button id="modo">👤 una persona (teléfono)</button>
</div>
<canvas id="c" width="640" height="360"></canvas>
<div class="leyenda" id="leyenda"></div>
<div class="leyenda" id="extras"></div>
<script id="datos" type="application/json">/*DATOS*/</script>
<script id="otras" type="application/json">/*EXTRAS*/</script>
<script>
(() => {
const DATOS = JSON.parse(document.getElementById('datos').textContent);
const c = document.getElementById('c'); const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
const W = c.width, H = c.height;
const P = { fondo:'#0e1322', tinta:'#e6edf3', gris:'#8892a6', verde:'#5df08a', ambar:'#ffcc4d', rojo:'#ff5c5c', azul:'#5cc3ff', lila:'#c58cff', naranja:'#ff9a3c', turquesa:'#3de0c8', panel:'#151b2b', borde:'#2a3550', oscuro:'#0b0f1a', carril:'#25314f' };
const sel = document.getElementById('corrida');
DATOS.forEach((d, i) => { const o = document.createElement('option'); o.value = i; o.textContent = d.etiqueta + (d.lado ? ` · ${d.lado === 'antes' ? 'antes' : 'después'}` : '') + `  (p95 meseta ${Math.round(d.resumen.p95_meseta)} ms)`; sel.appendChild(o); });
// Parejas: dos corridas del mismo escenario, una marcada «antes» y otra «despues» (animacion-datos.py).
const PAREJAS = [];
DATOS.forEach((d, i) => {
  if (d.lado !== 'antes') return;
  const j = DATOS.findIndex((e) => e.etiqueta === d.etiqueta && e.lado === 'despues');
  if (j >= 0) PAREJAS.push({ nombre: d.etiqueta, a: i, b: j });
});
let idx = 0, ipar = 0, t = 0, jugando = true, modo = PAREJAS.length ? 'comparar' : 'multitud', ultimo = performance.now();
const paquetes = [], paqA = [], paqB = [];
const rnd = (a, b) => a + Math.random() * (b - a);

// ---- primitivas de píxel --------------------------------------------------------------------
// Todo se dibuja en 640×360 y el navegador lo escala al doble sin suavizar: cada píxel lógico son
// cuatro de pantalla. La letra es de 10 px en el lienzo (20 en pantalla), monoespaciada.
const FUENTE = 10, ANCHO_LETRA = 6;
function px(x, y, w, h, col) { g.fillStyle = col; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function texto(s, x, y, col = P.tinta, tam = FUENTE) { g.fillStyle = col; g.font = `${tam}px monospace`; g.textBaseline = 'top'; g.fillText(s, Math.round(x), Math.round(y)); }
// Texto que NUNCA se sale de su ancho: se recorta con «…».
function textoEn(s, x, y, ancho, col = P.tinta, tam = FUENTE) {
  const maxc = Math.max(1, Math.floor(ancho / (ANCHO_LETRA * tam / FUENTE)));
  texto(s.length > maxc ? s.slice(0, Math.max(0, maxc - 1)) + '…' : s, x, y, col, tam);
}
function caja(x, y, w, h, col, titulo) {
  px(x, y, w, h, P.panel); px(x, y, w, 2, col); px(x, y + h - 2, w, 2, col); px(x, y, 2, h, col); px(x + w - 2, y, 2, h, col);
  if (titulo) { px(x + 2, y + 2, w - 4, 14, col); textoEn(titulo, x + 6, y + 4, w - 12, P.oscuro); }
}
function telefono(x, y, on) { px(x, y, 8, 13, on ? P.azul : '#3a4666'); px(x + 1, y + 1, 6, 9, on ? '#cfeeff' : '#1c2436'); px(x + 3, y + 11, 2, 1, P.oscuro); }
function chip(x, y, uso, etiqueta) {
  const col = uso > 90 ? P.rojo : uso > 60 ? P.ambar : P.verde;
  px(x, y, 22, 22, '#222b40'); px(x + 4, y + 4, 14, 14, col);
  for (let i = 0; i < 5; i++) { px(x - 2, y + 3 + i * 4, 2, 2, P.gris); px(x + 22, y + 3 + i * 4, 2, 2, P.gris); }
  texto(etiqueta, x + 2, y + 24, P.gris, 8);
}
function cilindro(x, y, w, col, etiqueta) { px(x, y, w, 5, col); px(x, y + 5, w, 14, '#2a3550'); px(x, y + 19, w, 5, col); px(x + 3, y + 8, w - 6, 1, '#3d4c73'); texto(etiqueta, x, y + 27, P.gris, 8); }

// ---- geometría: cinco cajas en fila, los carriles pasan POR DEBAJO y suben por conectores -----
const Z = {
  tel:   { x: 8,   y: 34, w: 118, h: 176 },
  nginx: { x: 142, y: 34, w: 96,  h: 176 },
  api:   { x: 254, y: 34, w: 140, h: 176 },
  fpm:   { x: 410, y: 34, w: 140, h: 176 },
  pg:    { x: 566, y: 34, w: 66,  h: 176 },
};
const CARRIL = { ida: 236, vuelta: 250 };

function conector(x, yDesde, yHasta) { px(x, yDesde, 2, yHasta - yDesde, P.carril); }

function dibujarMultitud(d, s, frac) {
  const S = d.series; const i = Math.min(Math.max(0, Math.floor(s)), d.segundos - 1);
  const fase = s < d.fase.rampa[1] ? 'rampa' : s < d.fase.meseta[1] ? 'meseta' : 'bajada';
  const activos = fase === 'rampa' ? Math.round(d.vus * Math.max(0, (s - d.fase.rampa[0]) / Math.max(1, d.fase.rampa[1] - d.fase.rampa[0]))) : fase === 'meseta' ? d.vus : Math.round(d.vus * Math.max(0, 1 - (s - d.fase.meseta[1]) / 12));
  px(0, 0, W, H, P.fondo);
  textoEn(d.etiqueta + (d.lado ? (d.lado === 'antes' ? ' · antes' : ' · después') : ''), 8, 8, W - 130, P.tinta, 12);
  texto(`${Math.floor(s)} s · ${fase}`, W - 8 - `${Math.floor(s)} s · ${fase}`.length * 7, 10, fase === 'meseta' ? P.verde : P.gris, 11);

  // --- teléfonos
  const T = Z.tel; caja(T.x, T.y, T.w, T.h, P.azul, `${activos} personas`);
  const cols = 9, iconos = Math.min(d.vus, 72), porIcono = d.vus / iconos;
  const concAPI = S.concurrencia[i] || 0;
  const activosIconos = Math.round(activos / porIcono), enCurso = Math.round(iconos * Math.min(1, concAPI / Math.max(1, d.vus)));
  for (let k = 0; k < iconos; k++) { const cx = T.x + 8 + (k % cols) * 12, cy = T.y + 22 + Math.floor(k / cols) * 15; telefono(cx, cy, k < activosIconos && k < enCurso); }
  textoEn(porIcono > 1 ? `1 icono = ${Math.round(porIcono)} personas` : 'una persona por icono', T.x + 6, T.y + T.h - 14, T.w - 12, P.gris, 8);

  // --- nginx
  const N = Z.nginx; caja(N.x, N.y, N.w, N.h, P.gris, 'nginx');
  const p95s = S.p95[i]; const p95txt = p95s == null ? '—' : p95s >= 1000 ? (p95s / 1000).toFixed(1) + ' s' : p95s + ' ms';
  textoEn(`${S.llegadas[i]} pet/s`, N.x + 6, N.y + 24, N.w - 12);
  textoEn('p95 al llegar', N.x + 6, N.y + 44, N.w - 12, P.gris, 8);
  textoEn(p95txt, N.x + 6, N.y + 54, N.w - 12, (p95s || 0) > 1500 ? P.rojo : (p95s || 0) > 500 ? P.ambar : P.verde, 12);
  textoEn(`errores ${S.errores[i]}`, N.x + 6, N.y + 74, N.w - 12, S.errores[i] ? P.rojo : P.gris);
  // barra vertical de p95 frente al SLO
  const alto = 70, lleno = Math.min(alto, (p95s || 0) / 3000 * alto);
  px(N.x + 6, N.y + 92, 12, alto, '#1c2436'); px(N.x + 6, N.y + 92 + alto - lleno, 12, lleno, (p95s || 0) > 1500 ? P.rojo : (p95s || 0) > 500 ? P.ambar : P.verde);
  px(N.x + 4, N.y + 92 + alto - alto / 2, 16, 1, P.tinta); texto('SLO', N.x + 22, N.y + 92 + alto / 2 - 4, P.gris, 8); texto('1,5 s', N.x + 22, N.y + 92 + alto / 2 + 5, P.gris, 8);

  // --- API
  const A = Z.api; caja(A.x, A.y, A.w, A.h, P.verde, 'API · uvicorn');
  const procesos = (d.resumen && d.resumen.procesos) || (d.etiqueta.startsWith('2') ? 2 : d.etiqueta.startsWith('4') ? 4 : 1); const cpu = S.api_cpu[i] || 0;
  for (let k = 0; k < procesos; k++) chip(A.x + 10 + k * 30, A.y + 24, cpu / procesos, `p${k + 1}`);
  const xTxt = A.x + 10 + procesos * 30 + 4, wTxt = A.w - 20 - procesos * 30;
  if (wTxt >= 70) {
    textoEn(`CPU ${Math.round(cpu)} % de ${procesos * 100}`, xTxt, A.y + 26, wTxt, cpu / procesos > 90 ? P.rojo : P.tinta, 9);
    textoEn(procesos === 1 ? 'un solo proceso:' : `${procesos} procesos:`, xTxt, A.y + 38, wTxt, P.gris, 8);
    textoEn(`techo ${procesos} núcleo${procesos > 1 ? 's' : ''}`, xTxt, A.y + 48, wTxt, P.gris, 8);
  } else {
    textoEn(`CPU ${Math.round(cpu)} % de ${procesos * 100}`, A.x + 8, A.y + 58, A.w - 16, cpu / procesos > 90 ? P.rojo : P.tinta, 9);
  }
  const cola = Math.max(0, Math.round(concAPI - (S.moodle_concurrencia[i] || 0)));
  textoEn(`dentro: ${Math.round(concAPI)}`, A.x + 8, A.y + 72, A.w - 16);
  textoEn(`esperando: ${cola}`, A.x + 8, A.y + 86, A.w - 16, cola > 20 ? P.rojo : cola > 5 ? P.ambar : P.gris);
  // la cola, como pila de bloques (cada bloque = 1 petición, hasta 220 visibles)
  const filaMax = 22;
  for (let k = 0; k < Math.min(cola, 220); k++) px(A.x + 8 + (k % filaMax) * 6, A.y + A.h - 12 - Math.floor(k / filaMax) * 6, 5, 5, cola > 50 ? P.rojo : P.ambar);
  if (cola > 220) textoEn(`+${cola - 220}`, A.x + A.w - 40, A.y + 96, 32, P.rojo, 8);

  // --- php-fpm
  const F = Z.fpm; caja(F.x, F.y, F.w, F.h, P.naranja, 'Moodle · php-fpm');
  const ocup = Math.min(40, Math.round(S.moodle_concurrencia[i] || 0)); const procs = Math.round(S.fpm_procesos[i] || 0);
  for (let k = 0; k < 40; k++) { const fx = F.x + 10 + (k % 10) * 12, fy = F.y + 24 + Math.floor(k / 10) * 12; px(fx, fy, 9, 9, k < ocup ? (ocup >= 38 ? P.rojo : P.naranja) : k < procs ? '#5a4030' : '#1c2436'); }
  textoEn(`ocupados ${ocup} de 40`, F.x + 8, F.y + 76, F.w - 16, ocup >= 38 ? P.rojo : P.tinta);
  textoEn(`procesos vivos ${procs}`, F.x + 8, F.y + 90, F.w - 16, P.gris, 8);
  textoEn(`${S.moodle_llamadas[i]} llamadas/s`, F.x + 8, F.y + 104, F.w - 16, P.tinta, 9);
  textoEn(`${S.moodle_ms_p50[i] ?? '—'} ms cada una`, F.x + 8, F.y + 116, F.w - 16, (S.moodle_ms_p50[i] || 0) > 300 ? P.ambar : P.gris, 9);
  textoEn(`CPU ${Math.round(S.fpm_cpu[i] || 0)} % (de 1200)`, F.x + 8, F.y + 130, F.w - 16, P.gris, 8);
  textoEn(`en Moodle: ${Math.round(S.moodle_concurrencia[i] || 0)}`, F.x + 8, F.y + 146, F.w - 16, P.tinta);

  // --- PostgreSQL
  const G = Z.pg; caja(G.x, G.y, G.w, G.h, P.lila, 'Postgres');
  cilindro(G.x + 12, G.y + 30, 42, P.lila, 'Moodle'); cilindro(G.x + 12, G.y + 90, 42, P.azul, 'API');

  // --- carriles por debajo de las cajas, conectores desde cada caja
  px(Z.tel.x + Z.tel.w / 2, CARRIL.ida, Z.pg.x + Z.pg.w / 2 - Z.tel.x - Z.tel.w / 2, 2, P.carril);
  px(Z.tel.x + Z.tel.w / 2, CARRIL.vuelta, Z.pg.x + Z.pg.w / 2 - Z.tel.x - Z.tel.w / 2, 2, P.carril);
  for (const z of Object.values(Z)) conector(z.x + z.w / 2, z.y + z.h, CARRIL.vuelta + 2);
  texto('ida →', Z.tel.x + Z.tel.w / 2 + 6, CARRIL.ida - 11, P.gris, 8); texto('← vuelta', Z.tel.x + Z.tel.w / 2 + 6, CARRIL.vuelta + 4, P.gris, 8);

  // --- paquetes: nacen según las llegadas reales del segundo; viven entre el p50 y el p95 reales
  const nacen = Math.round((S.llegadas[i] || 0) * frac);
  while (paquetes.filter(p => p.nace === i).length < nacen && paquetes.length < 1500) {
    const dura = Math.max(0.05, rnd(S.p50[i] || 40, S.p95[i] || 100) / 1000);
    paquetes.push({ nace: i, t0: s, dura, moodle: Math.random() < Math.min(1, (S.moodle_llamadas[i] || 0) / Math.max(1, S.llegadas[i] || 1)), y: rnd(-2, 2) });
  }
  for (let k = paquetes.length - 1; k >= 0; k--) {
    const p = paquetes[k]; const a = (s - p.t0) / p.dura; if (a >= 1 || a < 0) { paquetes.splice(k, 1); continue; }
    const x0 = Z.tel.x + Z.tel.w / 2, x1 = p.moodle ? Z.pg.x + Z.pg.w / 2 : Z.api.x + Z.api.w / 2;
    const x = a < 0.5 ? x0 + (x1 - x0) * (a / 0.5) : x1 - (x1 - x0) * ((a - 0.5) / 0.5);
    const col = p.dura > 1.5 ? P.rojo : p.dura > 0.5 ? P.ambar : P.verde;
    px(x, (a < 0.5 ? CARRIL.ida : CARRIL.vuelta) + p.y - 1, 3, 3, col);
  }

  // --- pie: lectura del segundo
  px(0, 268, W, 1, P.borde);
  texto(`p95 de lo que llega este segundo: ${p95txt}`, 8, 276, (p95s || 0) > 1500 ? P.rojo : P.tinta, 11);
  texto(`SLO 1,5 s`, 300, 276, P.gris, 11);
  texto(`a la vez: ${Math.round(concAPI)} peticiones en la API · ${Math.round(S.moodle_concurrencia[i] || 0)} llamadas en Moodle`, 8, 294, P.gris, 10);
  const donde = cola > 20 && ocup < 30 ? 'la cola está en la API: el proceso no da abasto' : ocup >= 38 ? 'la cola está en Moodle: php-fpm sin trabajadores libres' : cola > 20 ? 'colas en la API y en Moodle' : 'sin colas';
  texto(donde, 8, 312, cola > 20 || ocup >= 38 ? P.ambar : P.verde, 11);
  // barra horizontal del p95 (escala 0–3 s)
  const ancho = Math.min(W - 16, (p95s || 0) / 3000 * (W - 16));
  px(8, 336, W - 16, 12, '#1c2436'); px(8, 336, ancho, 12, (p95s || 0) > 1500 ? P.rojo : (p95s || 0) > 500 ? P.ambar : P.verde); px(8 + (W - 16) / 2, 332, 2, 18, P.tinta);
  texto('0', 8, 352, P.gris, 8); texto('1,5 s', 8 + (W - 16) / 2 + 5, 352, P.gris, 8); texto('3 s', W - 24, 352, P.gris, 8);
}

// ---- antes / después: las dos corridas del mismo escenario, a la vez y con el mismo reloj -------
// Dos bandas con la misma tubería en pequeño. Lo que cambia se ve moverse: las respuestas 429
// rebotan en nginx, las filas caen a la base de la API por su propio carril y el contador de
// líneas de log corre dentro de la caja de la API.
const B = { tel: { x: 8, w: 112 }, nginx: { x: 130, w: 84 }, api: { x: 224, w: 132 }, redis: { x: 366, w: 54 }, fpm: { x: 430, w: 132 }, pg: { x: 572, w: 60 } };
const ALTO = 86;
const cx = (z) => z.x + z.w / 2;
const coma = (x) => String(x).replace('.', ',');
const fms = (ms) => ms == null ? '—' : ms >= 1000 ? coma((ms / 1000).toFixed(1)) + ' s' : Math.round(ms) + ' ms';
const colP95 = (ms) => (ms || 0) > 1500 ? P.rojo : (ms || 0) > 500 ? P.ambar : P.verde;
// Ancho real de un texto en el lienzo: para encadenar textos sin que uno pise al siguiente.
const ancho = (s, tam = FUENTE) => { g.font = `${tam}px monospace`; return Math.ceil(g.measureText(s).width); };

function banda(d, s, y0, paqs) {
  const S = d.series; const i = Math.min(Math.max(0, Math.floor(s)), d.segundos - 1); const frac = s - Math.floor(s);
  const fase = s < d.fase.rampa[1] ? 'rampa' : s < d.fase.meseta[1] ? 'meseta' : 'bajada';
  const activos = fase === 'rampa' ? Math.round(d.vus * Math.max(0, (s - d.fase.rampa[0]) / Math.max(1, d.fase.rampa[1] - d.fase.rampa[0]))) : fase === 'meseta' ? d.vus : Math.round(d.vus * Math.max(0, 1 - (s - d.fase.meseta[1]) / 12));
  const antes = d.lado === 'antes'; const tono = antes ? P.ambar : P.verde;
  px(8, y0, antes ? 40 : 52, 11, tono); texto(antes ? 'ANTES' : 'DESPUÉS', 11, y0 + 1, P.oscuro, 9);
  textoEn(`p95 en la meseta ${fms(d.resumen.p95_meseta)} · ${d.resumen.rechazos} respuestas 429 en la corrida · ${fase}`, antes ? 54 : 66, y0 + 1, W - 80, P.gris, 9);
  const y = y0 + 14;

  // personas
  const T = B.tel; caja(T.x, y, T.w, ALTO, P.azul, `${activos} personas`);
  const cols = 9, iconos = Math.min(d.vus, 36), porIcono = d.vus / iconos;
  const concAPI = S.concurrencia[i] || 0;
  const encendidos = Math.min(Math.round(activos / porIcono), Math.round(iconos * Math.min(1, concAPI / Math.max(1, d.vus))));
  for (let k = 0; k < iconos; k++) telefono(T.x + 7 + (k % cols) * 11, y + 20 + Math.floor(k / cols) * 16, k < encendidos);

  // nginx
  const N = B.nginx; caja(N.x, y, N.w, ALTO, P.gris, 'nginx');
  const p95s = S.p95[i], rech = S.rechazos[i] || 0;
  textoEn(`${S.llegadas[i]} pet/s`, N.x + 6, y + 19, N.w - 12, P.tinta, 9);
  textoEn(`p95 ${fms(p95s)}`, N.x + 6, y + 31, N.w - 12, colP95(p95s), 11);
  textoEn(`429: ${rech} /s`, N.x + 6, y + 47, N.w - 12, rech ? P.rojo : P.gris, 10);
  const anchoB = N.w - 12, lleno = Math.min(anchoB, (p95s || 0) / 3000 * anchoB);
  px(N.x + 6, y + 62, anchoB, 7, '#1c2436'); px(N.x + 6, y + 62, lleno, 7, colP95(p95s)); px(N.x + 6 + anchoB / 2, y + 60, 1, 11, P.tinta);
  texto('SLO 1,5 s', N.x + N.w - 6 - ancho('SLO 1,5 s', 8), y + 72, P.gris, 8);

  // API
  const A = B.api; caja(A.x, y, A.w, ALTO, P.verde, 'API · uvicorn');
  const procesos = d.resumen.procesos || 1, cpu = S.api_cpu[i] || 0;
  for (let k = 0; k < Math.min(procesos, 2); k++) chip(A.x + 8 + k * 30, y + 19, cpu / procesos, `p${k + 1}`);
  const cola = Math.max(0, Math.round(concAPI - (S.moodle_concurrencia[i] || 0)));
  textoEn(`CPU ${Math.round(cpu)} %`, A.x + 70, y + 20, A.w - 76, cpu / procesos > 90 ? P.rojo : P.tinta, 9);
  textoEn(`espera ${cola}`, A.x + 70, y + 32, A.w - 76, cola > 20 ? P.rojo : cola > 5 ? P.ambar : P.gris, 9);
  const lin = S.log_lineas[i] || 0;
  textoEn(`log ${lin} lín/s`, A.x + 8, y + 54, A.w - 16, lin > 300 ? P.ambar : P.gris, 9);
  for (let k = 0; k < Math.min(cola, 60); k++) px(A.x + 7 + (k % 20) * 6, y + 66 + Math.floor(k / 20) * 6, 5, 5, cola > 50 ? P.rojo : P.ambar);
  if (cola > 60) textoEn(`+${cola - 60}`, A.x + A.w - 36, y + 54, 30, P.rojo, 9);

  // Redis: lo que comparten los procesos de la API. No está en el camino de la petición hacia

  const Rd = B.redis; const hayRedis = !!d.resumen.redis;

    px(A.x + A.w, y + 36, Rd.x - A.x - A.w, 2, P.turquesa); px(A.x + A.w, y + 42, Rd.x - A.x - A.w, 2, P.turquesa);
  } else {

  }

  // php-fpm
  const F = B.fpm; caja(F.x, y, F.w, ALTO, P.naranja, 'Moodle · php-fpm');
  const ocup = Math.min(40, Math.round(S.moodle_concurrencia[i] || 0)), procs = Math.round(S.fpm_procesos[i] || 0);
  for (let k = 0; k < 40; k++) px(F.x + 6 + (k % 20) * 6, y + 19 + Math.floor(k / 20) * 6, 5, 5, k < ocup ? (ocup >= 38 ? P.rojo : P.naranja) : k < procs ? '#5a4030' : '#1c2436');
  textoEn(`ocupados ${ocup} de 40`, F.x + 8, y + 34, F.w - 16, ocup >= 38 ? P.rojo : P.tinta);
  textoEn(`${S.moodle_llamadas[i]} llamadas/s`, F.x + 8, y + 47, F.w - 16, P.tinta, 9);
  textoEn(`${S.moodle_ms_p50[i] ?? '—'} ms cada una`, F.x + 8, y + 58, F.w - 16, (S.moodle_ms_p50[i] || 0) > 300 ? P.ambar : P.gris, 9);
  textoEn(`CPU ${Math.round(S.fpm_cpu[i] || 0)} %`, F.x + 8, y + 70, F.w - 16, P.gris, 8);

  // base de la API: filas escritas por segundo = llegadas reales del segundo × filas por petición de la corrida
  const G = B.pg; caja(G.x, y, G.w, ALTO, P.lila, 'BD API');
  const fpp = d.resumen.filas_por_peticion; const filasSeg = fpp == null ? null : (S.llegadas[i] || 0) * fpp;

  textoEn(filasSeg == null ? '—' : filasSeg >= 10 ? `${Math.round(filasSeg)}/s` : `${coma(filasSeg.toFixed(1))}/s`, G.x + 6, y + 46, G.w - 12, (filasSeg || 0) > 20 ? P.ambar : P.verde, 10);
  textoEn('filas', G.x + 6, y + 58, G.w - 12, P.gris, 8);
  textoEn(fpp == null ? '' : `${coma(fpp)}/pet`, G.x + 6, y + 69, G.w - 12, P.gris, 8);

  // carriles: ida, vuelta y, aparte, el de las filas hacia la base
  const yIda = y + ALTO + 8, yVuelta = yIda + 8, yEsc = yVuelta + 8;
  px(cx(T), yIda, cx(F) - cx(T), 2, P.carril); px(cx(T), yVuelta, cx(F) - cx(T), 2, P.carril);
  for (const z of [T, N, A, F]) px(cx(z), y + ALTO, 2, yVuelta + 2 - y - ALTO, P.carril);
  px(cx(A) + 6, yEsc, cx(G) - cx(A) - 6, 2, '#3a2f55'); px(cx(A) + 6, y + ALTO, 2, yEsc + 2 - y - ALTO, '#3a2f55'); px(cx(G), y + ALTO, 2, yEsc + 2 - y - ALTO, '#3a2f55');
  texto('filas a la base →', cx(A) - 96, yEsc - 3, P.gris, 8);

  // paquetes: peticiones (según las llegadas reales), rechazos 429 y filas
  const cuantos = (tipo) => paqs.reduce((n, p) => n + (p.nace === i && p.tipo === tipo ? 1 : 0), 0);
  const servidas = Math.max(0, (S.llegadas[i] || 0) - rech);
  while (cuantos('p') < Math.round(servidas * frac) && paqs.length < 900) {

    const p = paqs[k]; const a = (s - p.t0) / p.dura; if (a >= 1 || a < 0) { paqs.splice(k, 1); continue; }

    else px(x, yy, 3, 3, col);

}

function duracionPareja(par) {

  return Math.max(10, Math.min(a.segundos - Math.max(0, a.fase.rampa[0]), b.segundos - Math.max(0, b.fase.rampa[0])));
}

// ---- una persona: cada petición como barra, con el tramo del servidor -------------------------
function personaComprimida(d) {
  const T = (d.telefono || []).filter(p => p.repe === 1).sort((a, b) => a.ini - b.ini);
  let desplaz = T.length ? T[0].ini : 0, ult = -Infinity; const out = [];
  for (const p of T) {
    if (p.ini - ult > 1500 && ult !== -Infinity) desplaz += (p.ini - ult) - 1500;
    ult = Math.max(ult, p.ini);
    out.push({ ...p, ini: p.ini - desplaz, fin: p.fin - desplaz });
  }
  return out;
}
const NOMBRE = [[/\/notifications\/unread\/count/, 'conteo de notif.'], [/\/dashboard\/admin/, 'panel'], [/\/dashboard\/cursos\/\{id\}/, 'detalle del curso'], [/\/agenda\/pendientes/, 'agenda'], [/\/auth\/validate/, 'validar sesión'], [/\/grades\/my_role/, 'mi rol'], [/\/grades\/parsed_table/, 'notas'], [/\/cursos\/\{id\}\/resultados-de-aprendizaje/, 'resultados'], [/\/notifications\/list/, 'lista de notif.'], [/\/calendario\/eventos/, 'calendario'], [/\/mobile\/pantallas/, 'pantallas'], [/\/auth\/login/, 'login']];
const nombre = (r) => { for (const [re, n] of NOMBRE) if (re.test(r)) return n; return r.slice(0, 18); };
function dibujarPersona(d, s) {
  px(0, 0, W, H, P.fondo);
  const T = personaComprimida(d); if (!T.length) { texto('sin traza del teléfono en esta corrida', 8, 8); return; }
  texto('Una persona en su teléfono, con el servidor libre', 8, 8, P.tinta, 12);
  texto('cada barra es una petición vista desde el teléfono; el tramo claro, lo que tardó el servidor', 8, 24, P.gris, 9);
  const fin = Math.max(...T.map(p => p.fin)); const x0 = 150, esc = (W - x0 - 90) / fin; const ms = s * 1000 / 8;
  let y = 44; let rec = '';
  for (const p of T) {
    if (p.rec !== rec) { rec = p.rec; if (y > 44) y += 3; px(8, y, 2, 8, P.azul); textoEn(rec, 14, y - 1, 120, P.azul, 9); }
    const x = x0 + p.ini * esc, w = Math.max(2, p.ms * esc);
    const col = p.ms > 1000 ? P.rojo : p.ms > 300 ? P.ambar : P.verde;
    px(x, y, w, 7, col); if (p.srv) px(x + Math.max(0, (p.ms - p.srv) / 2) * esc, y + 2, Math.max(1, p.srv * esc), 3, '#f4f8ff');
    const etiqueta = `${nombre(p.ruta)} ${Math.round(p.ms)} ms`, anchoEt = etiqueta.length * ANCHO_LETRA * 0.8;
    if (x + w + 4 + anchoEt <= W - 4) texto(etiqueta, x + w + 4, y - 1, P.gris, 8);
    else texto(etiqueta, x - anchoEt - 4, y - 1, P.gris, 8);
    y += 10; if (y > H - 40) break;
  }
  const t = Math.min(fin, ms); const xr = x0 + t * esc; px(xr, 40, 1, H - 70, P.ambar);
  texto(`${Math.round(t)} ms`, Math.min(W - 60, xr + 4), H - 28, P.ambar, 10);
  texto(`${T.length} peticiones · la última respuesta llega a los ${Math.round(fin)} ms (pausas entre gestos recortadas a 1,5 s) · reloj a 1/8`, 8, H - 14, P.gris, 8);
}

function frame(ahora) {
  const d = DATOS[idx]; const dtms = ahora - ultimo; ultimo = ahora;
  if (jugando) t += (dtms / 1000) * Number(document.getElementById('vel').value);
  const finP = modo === 'persona' ? (personaComprimida(d).reduce((m, p) => Math.max(m, p.fin), 0) / 1000 * 8 || 40) : 0;
  if (modo === 'comparar') {
    const par = PAREJAS[ipar], fin = duracionPareja(par);
    if (t > fin) { t = 0; paqA.length = 0; paqB.length = 0; }
    dibujarComparacion(par, t);
    document.getElementById('scrub').value = Math.round(100 * t / fin);
    document.getElementById('reloj').textContent = `${Math.floor(t)} s de ${Math.floor(fin)}`;
    requestAnimationFrame(frame); return;
  }
  if (modo === 'multitud') { if (t > d.segundos) t = 0; dibujarMultitud(d, t, t - Math.floor(t)); }
  else { if (t > finP + 1) t = 0; dibujarPersona(d, t); }
  document.getElementById('scrub').value = modo === 'multitud' ? Math.round(100 * t / d.segundos) : Math.round(100 * t / finP);
  document.getElementById('reloj').textContent = modo === 'multitud' ? `${Math.floor(t)} s de ${d.segundos}` : `${Math.round(t * 1000 / 8)} ms`;
  requestAnimationFrame(frame);
}

      <span class="k" style="background:#5df08a"></span>petición de menos de 0,5 s · <span class="k" style="background:#ffcc4d"></span>entre 0,5 y 1,5 s · <span class="k" style="background:#ff5c5c"></span>más de 1,5 s, o un 429 que rebota en nginx (cuadro rojo hueco) · <span class="k" style="background:#c58cff"></span>filas escritas en la base de la API · <span class="k" style="background:#3de0c8"></span>Redis: la memoria que comparten los procesos de la API (caché por persona y cupos); no está en el camino hacia Moodle, y su memoria y su CPU son las de su contenedor en ese segundo. Antes: ${a.resumen.peticiones} peticiones, p95 en la meseta ${Math.round(a.resumen.p95_meseta)} ms. Después: ${b.resumen.peticiones} peticiones, p95 ${Math.round(b.resumen.p95_meseta)} ms.`;

       <span class="k" style="background:#5df08a"></span>petición de menos de 0,5 s · <span class="k" style="background:#ffcc4d"></span>entre 0,5 y 1,5 s · <span class="k" style="background:#ff5c5c"></span>más de 1,5 s (fuera del SLO). La pila de bloques dentro de la API son las peticiones que esperan al proceso; los cuadros naranjas de php-fpm, los trabajadores ocupados de 40. Corrida: <code>${d.etiqueta}</code>, ${d.resumen.peticiones} peticiones, ${d.resumen.moodle} llamadas a Moodle, p95 en la meseta ${Math.round(d.resumen.p95_meseta)} ms.`
    : `<b>Qué es real:</b> cada petición que la app hizo desde el teléfono (Xiaomi 2407FPN8EG, Wi-Fi del laboratorio), con su inicio y su fin medidos en el teléfono, y el tiempo que el servidor dijo haber tardado (<code>X-Execution-Time-Ms</code>). La diferencia es la red de ida y vuelta. Reloj a 1/8 de la velocidad real; las pausas entre gestos se recortan a 1,5 s.`;
