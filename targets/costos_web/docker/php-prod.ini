; Production-like PHP settings for the load/stress runs.
; memory_limit is deliberately a REAL limit (not -1): we want to observe whether the
; application can be pushed past it (e.g. the uncapped `per_page` parameter).
memory_limit = 192M
max_execution_time = 30

; Hide the PHP version. Also verifies the open finding: the app's SecurityHeaders
; middleware cannot remove X-Powered-By because PHP emits it at SAPI level.
expose_php = Off

; Opcache on, as any production deployment would have.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
