; PHP-FPM pool for the load tests.
; `static` keeps the worker count fixed so the breaking point is attributable to a
; declared envelope rather than to autoscaling noise.
[www]
user = www-data
group = www-data
listen = 0.0.0.0:9000

pm = static
; Sized to the container memory limit (1.5 GB) at ~192 MB/worker worst case.
pm.max_children = 10
pm.max_requests = 500

; Telemetry: workers busy/idle and the listen queue. Saturation shows up here first.
pm.status_path = /fpm-status
ping.path = /fpm-ping

; Any request slower than this gets a stack trace in the slowlog.
request_slowlog_timeout = 5s
slowlog = /proc/self/fd/2

catch_workers_output = yes
decorate_workers_output = no
clear_env = no
