worker_processes auto;
events { worker_connections 4096; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # $request_time and upstream timing let us separate nginx queueing from PHP work.
    log_format perf '$remote_addr $status $request_time $upstream_response_time "$request"';
    access_log /var/log/nginx/access.log perf;

    # Big enough not to be the limiting factor on the import endpoint.
    client_max_body_size 64m;

    upstream php {
        server fpm:9000;
    }

    server {
        listen 80;
        root /app/public;
        index index.php;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # PHP-FPM pool telemetry (restricted to the compose network).
        location ~ ^/(fpm-status|fpm-ping)$ {
            access_log off;
            fastcgi_pass php;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $fastcgi_script_name;
        }

        location ~ \.php$ {
            fastcgi_pass php;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            # Long enough to observe slow requests instead of masking them as 504.
            fastcgi_read_timeout 120s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }
    }
}
