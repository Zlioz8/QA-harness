# OWASP ZAP Automation Framework plan (declarative — ZAP runs it, no bash).
# Scope: the running backend API. Unauthenticated surface here (CORS, security
# headers, info leakage, public endpoints). Authenticated authorization is covered
# by the Playwright flows, which drive the real session-cookie login.
#
# La URL del blanco NO se incrusta: ${ZAP_TARGET_URL} la inyecta el core desde APP_INTERNAL_URL
# del target (ver el servicio `zap` en docker-compose.yml). El mismo plan sirve para un despliegue
# local o uno externo (p.ej. https://<host-de-validacion>) sin editarlo.
env:
  contexts:
    - name: costos-api
      urls:
        - "${ZAP_TARGET_URL}"
      includePaths:
        - "${ZAP_TARGET_URL}/api.*"
        - "${ZAP_TARGET_URL}/sanctum.*"
      excludePaths:
        - ".*/logout"
  parameters:
    failOnError: true
    progressToStdout: true

jobs:
  - type: spider
    parameters:
      context: costos-api
      url: "${ZAP_TARGET_URL}/api"
      maxDuration: 3

  - type: passiveScan-wait
    parameters:
      maxDuration: 5

  # Active scan probes for injection/misconfig on discovered endpoints.
  - type: activeScan
    parameters:
      context: costos-api
      policy: "Default Policy"
      maxRuleDurationInMins: 2

  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk/reports
      reportFile: zap-report
    risks: [info, low, medium, high]

  - type: report
    parameters:
      template: sarif-json
      reportDir: /zap/wrk/reports
      reportFile: zap-report
