# SonarQube project descriptor (native config — no script).
# Adjust sonar.sources per target via the two subdirs; everything else is generic.
sonar.projectKey=costos_web
sonar.projectName=Costos Web (audit)
sonar.sources=CostosWeb2.0_Back,CostosWeb2.0_Front
sonar.sourceEncoding=UTF-8

# Never analyze third-party or build artifacts.
sonar.exclusions=**/vendor/**,**/node_modules/**,**/dist/**,**/build/**,**/*.min.js,**/public/build/**

# PHP + JS/TS/Vue analysis is built into the Community edition.
sonar.php.file.suffixes=php
sonar.javascript.file.suffixes=.js,.vue
