# Modelo de amenazas del perfil — lo evalúa Threagile (`make amenazas TARGET=<perfil>`).
#
# COPIA Y REESCRIBE. Este es un ejemplo mínimo (un cliente, una API, una base) que Threagile
# acepta tal cual; con él `make amenazas` mide el ejemplo, no tu sistema, y guion-check lo dirá.
# Lo que hay que escribir es lo que solo se sabe conociendo la arquitectura: qué activos hay,
# qué datos procesan y guardan, por qué enlaces se hablan (protocolo, autenticación,
# autorización) y qué fronteras de confianza los separan. Vocabulario exacto:
#   docker run --rm threagile/threagile:0.9.1 -list-types
#   docker run --rm threagile/threagile:0.9.1 -explain-risk-rules
# `internet: true` significa «vive en internet» (el navegador de la persona, un IdP ajeno), NO «está
# expuesto»: el borde (nginx, balanceador) va con `internet: false`, o Threagile lo tratará como un
# atacante que alcanza tu API. Los ids (`id:`) son la clave de triaje de cada riesgo: elígelos estables y no los renombres
# a la ligera. Ninguna regla builtin es Repudiation: la R se declara en
# individual_risk_categories y se MIDE con las sondas de auditoría (aaa/acct.json).
