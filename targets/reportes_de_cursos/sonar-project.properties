# SonarQube — descriptor para reportes_de_cursos (ZAJUNA Early Alert).
#
# MULTI-REPO: `SRC_PATH` apunta al DIRECTORIO PADRE («REPORTES DE CURSOS»), no al repositorio.
# Con `sonar.sources=.` el escáner analizaría ese escritorio entero. Aquí se listan los árboles de
# código de `Analitica_cursos/`, igual que en el perfil `movil`, y deben coincidir con SOURCE_DIRS
# del perfil: si divergen, el informe declara una cobertura que el escaneo no tuvo.
#
# El segundo repositorio del proyecto (`reportes_de_curso`) NO está aquí: el operador QA lo
# declaró legacy y fuera de alcance el 21/08/2026. Consta en RUN.md y en el informe.
sonar.projectKey=reportes_de_cursos
sonar.projectName=reportes_de_cursos (audit)
sonar.sources=Analitica_cursos/plugin,Analitica_cursos/zea-api,Analitica_cursos/vue-app/src,Analitica_cursos/scripts
sonar.sourceEncoding=UTF-8

# Terceros y artefactos generados: analizarlos es analizar a otro.
# `plugin/js` y `plugin/amd/build` son el bundle de widgets COMPILADO desde `vue-app/src`
# (vite.config.js, entorno `widgets`): sus hallazgos son los de la fuente, otra vez y minificados.
sonar.exclusions=**/vendor/**,**/node_modules/**,**/dist/**,**/build/**,**/*.min.js,Analitica_cursos/plugin/js/**,Analitica_cursos/plugin/amd/build/**

# Los lenguajes que este proyecto usa de verdad (censo de `make detect`: php=220, ts=345, go=171).
sonar.php.file.suffixes=.php
sonar.javascript.file.suffixes=.js,.vue
sonar.typescript.file.suffixes=.ts
sonar.go.file.suffixes=.go

# Las pruebas se analizan como pruebas, no como producción: sus reglas no contaminan la deuda del
# código que se despliega, y siguen contando para la pregunta «¿hay pruebas?».
sonar.tests=Analitica_cursos/plugin/tests,Analitica_cursos/vue-app/tests
sonar.test.inclusions=**/tests/**,**/*_test.go,**/*.spec.ts,**/*_test.php
