# SECURITY-LAB — CORE. Only the analysis tools live here; they are project-agnostic.
#
# Everything that knows *what* is being audited (how the app boots, how you log in,
# which endpoints exist, the DB seed) lives in targets/<name>/ and is layered on top:
#
#   docker compose --env-file targets/<name>/target.env \
#                  -f docker-compose.yml -f targets/<name>/compose.runtime.yml ...
#
# The Makefile does that for you (`make <goal> TARGET=<name>`).
#
# Invariants this file must keep:
#   - No project name, framework or endpoint appears below. If you need one, it
#     belongs in a target profile.
#   - The audited source is mounted READ-ONLY. The lab observes; it never fixes.
#   - Published ports bind to 127.0.0.1 only (lab finding L1: the lab may hold real
#     data, and 0.0.0.0 publishes it to the whole LAN).
#
# Variables consumed (all defined in targets/<name>/target.env):
#   TARGET_NAME  SRC_PATH  SOURCE_DIRS  QODANA_IMAGE  SONAR_PORT  SONAR_TOKEN
#   QODANA_TOKEN SEMGREP_CONFIG  BASE_URL  APP_INTERNAL_URL  ALLOWED_ORIGIN
#   ROLE_A_USER ROLE_A_PASS ROLE_B_USER ROLE_B_PASS
#
# Profiles:  clone | static | dast | perf | e2e     (runtime/build come from the target)

services:

  # ---------- fetch (optional: prefer SRC_PATH on a checkout you already have) ----------
  # Kept for repos you do not have locally. Mounts a DEDICATED deploy key, never the
  # user's whole ~/.ssh (lab finding L2).
  clone:
    profiles: ["clone"]
    image: alpine/git:latest
    environment:
      GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes"
    volumes:
      - ./work:/work
      - ${DEPLOY_KEY:-./configs/deploy_key}:/root/.ssh/id_ed25519:ro
    command: >
      clone --branch ${BRANCH:-main} ${REPO_URL:-} /work/${TARGET_NAME}

  # ---------- static: repo-shaped. Runs on ANY project with zero knowledge of it ----------
  sonarqube:
    profiles: ["static"]
    image: sonarqube:community
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "127.0.0.1:${SONAR_PORT:-9000}:9000"
    healthcheck:
      # The sonarqube image ships curl, not wget — a wget-based check is always "unhealthy",
      # which blocks sonar-scanner's depends_on service_healthy even though the server is UP.
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      # SonarQube cold-boots ES + web + CE in ~2 min; without a start_period the early failing
      # probes exhaust retries (or the dependent aborts) before it is ever ready.
      start_period: 180s

  sonar-scanner:
    profiles: ["static"]
    image: sonarsource/sonar-scanner-cli:latest
    depends_on:
      sonarqube:
        condition: service_healthy
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN:-}
    volumes:
      - ${SRC_PATH}:/usr/src:ro
      # Config OUTSIDE the read-only source: nesting it at /usr/src/sonar-project.properties
      # fails ("read-only file system") on any repo that does not already ship the file at its
      # root — docker cannot create the mountpoint inside a ro mount. -Dproject.settings points
      # the scanner at it; projectBaseDir stays /usr/src so sonar.sources=. resolves correctly.
      - ./targets/${TARGET_NAME}/sonar-project.properties:/opt/scan/sonar-project.properties:ro
      - ./reports/${TARGET_NAME}/sonar:/reports
    command: ["-Dproject.settings=/opt/scan/sonar-project.properties", "-Dsonar.projectBaseDir=/usr/src"]

  # Linter image is chosen per target (qodana-php / qodana-python / qodana-js).
  qodana:
    profiles: ["static"]
    image: ${QODANA_IMAGE:-jetbrains/qodana-php:latest}
    environment:
      QODANA_TOKEN: ${QODANA_TOKEN:-}
    volumes:
      - ${SRC_PATH}:/data/project:ro
      # Config lives OUTSIDE the read-only source. Nesting it at /data/project/qodana.yaml
      # fails ("read-only file system") on any audited repo that does not already ship a
      # qodana.yaml at its root — docker cannot create the mountpoint inside a ro mount.
      # --config points qodana at it instead, which needs no writable spot in the source.
      - ./targets/${TARGET_NAME}/qodana.yaml:/data/conf/qodana.yaml:ro
      - ./reports/${TARGET_NAME}/qodana:/data/results
    # --project-dir points qodana at the sub-repo to inspect. Qodana requires a git repo at the
    # project dir (it fails "not a git repository" otherwise), so a workspace whose root is not a
    # repo but whose CHILDREN are (movil = zajuna-frontend + zajuna-backend) must name one via
    # QODANA_SUBDIR in target.env. Single-repo targets leave it unset and inspect the root ".".
    command: ["--save-report", "--config", "/data/conf/qodana.yaml", "--project-dir", "/data/project/${QODANA_SUBDIR:-.}"]

  # Polyglot SAST with taint tracking. Covers the languages Qodana does not, and finds
  # injection/authz patterns SonarQube Community misses (raw SQL, command exec, deserialization).
  semgrep:
    profiles: ["static"]
    image: semgrep/semgrep:latest
    volumes:
      - ${SRC_PATH}:/src:ro
      - ./reports/${TARGET_NAME}/semgrep:/reports
    working_dir: /src
    # Explicit rulesets, never --config=auto: auto refuses to run with --metrics=off,
    # i.e. it requires phoning home about the code being scanned. Not acceptable for
    # institutional source. Override the set per target with SEMGREP_CONFIG.
    #
    # No --error either: like every other tool here, semgrep must not decide the verdict.
    # `make gate` does that, from thresholds the target declares.
    command: >
      semgrep scan ${SEMGREP_CONFIG:---config=p/security-audit --config=p/secrets --config=p/owasp-top-ten}
             --metrics=off --sarif --output=/reports/semgrep.sarif
             --exclude=node_modules --exclude=vendor --exclude=.venv --exclude=__pycache__ /src

  # Full git history — proves whether a rotated secret is still recoverable.
  gitleaks:
    profiles: ["static"]
    image: zricethezav/gitleaks:latest
    volumes:
      - ${SRC_PATH}:/repo:ro
      - ./targets/${TARGET_NAME}/gitleaks.toml:/config/gitleaks.toml:ro
      - ./reports/${TARGET_NAME}:/reports
    command: >
      detect --source=/repo --config=/config/gitleaks.toml
             --log-opts=--all --report-format=sarif
             --report-path=/reports/gitleaks.sarif --redact --exit-code=0

  trufflehog:
    profiles: ["static"]
    image: trufflesecurity/trufflehog:latest
    volumes:
      - ${SRC_PATH}:/repo:ro
      - ./reports/${TARGET_NAME}:/reports
    command: >
      git file:///repo --json --no-update

  # Dependency CVEs + embedded secrets in the working tree.
  trivy:
    profiles: ["static"]
    image: aquasec/trivy:latest
    volumes:
      - ${SRC_PATH}:/repo:ro
      - ./reports/${TARGET_NAME}/trivy:/reports
      - trivy_cache:/root/.cache
    command: >
      fs --scanners vuln,secret,misconfig --format sarif
         --output /reports/trivy-fs.sarif /repo

  # Dockerfiles / compose / k8s the TARGET ships. Catches plaintext brokers, anonymous
  # auth, 0.0.0.0 binds — the class of finding no code scanner reports.
  trivy-config:
    profiles: ["static"]
    image: aquasec/trivy:latest
    volumes:
      - ${SRC_PATH}:/repo:ro
      - ./reports/${TARGET_NAME}/trivy:/reports
      - trivy_cache:/root/.cache
    command: >
      config --format sarif --output /reports/trivy-config.sarif /repo

  # Scans a built image (the target's own, or a third-party base it pins).
  # Usage: make image-scan TARGET=x IMAGE=repo/name:tag
  trivy-image:
    profiles: ["static"]
    image: aquasec/trivy:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./reports/${TARGET_NAME}/trivy:/reports
      - trivy_cache:/root/.cache
    command: >
      image --scanners vuln --format sarif
            --output /reports/trivy-image.sarif ${IMAGE:-alpine:latest}

  # SBOM + licences. Answers "what is actually shipped" independently of the manifests.
  syft:
    profiles: ["static"]
    image: anchore/syft:latest
    volumes:
      - ${SRC_PATH}:/repo:ro
      - ./reports/${TARGET_NAME}/sbom:/reports
    command: >
      scan dir:/repo -o spdx-json=/reports/sbom.spdx.json -o table=/reports/sbom.txt

  # ---------- dast ----------
  # Declarative plan; ZAP interprets it. The plan is per-target because contexts and
  # URL patterns are project knowledge.
  zap:
    profiles: ["dast"]
    image: zaproxy/zap-stable:latest
    # Reaching an application the lab did NOT bring up (the common case: the team already
    # deploys it themselves). Inside this network, "localhost" is the tool's own container —
    # so a host deployment is addressed as host.docker.internal, which on Linux only resolves
    # with this mapping. Playwright does not need it: it runs with network_mode: host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./targets/${TARGET_NAME}/zap:/zap/wrk/zap:ro
      - ./reports/${TARGET_NAME}/zap:/zap/wrk/reports
    command: >
      zap.sh -cmd -autorun /zap/wrk/zap/automation.yaml

  # ---------- perf ----------
  # Generator runs unconstrained on purpose: it must not compete for CPU with the
  # system under test, which is the thing that carries declared resource limits.
  k6:
    profiles: ["perf"]
    image: grafana/k6:latest
    # The grafana/k6 image runs as uid 12345; the reports directory is pre-created by the host
    # user (see the Makefile guard), so an unprivileged k6 cannot write its --summary-export and
    # the run dies with "permission denied". Run as root like the other tool containers (trivy,
    # semgrep): it only writes into the mounted reports dir, which the host still owns.
    user: "0:0"
    # See the note on the zap service: lets APP_INTERNAL_URL point at a deployment running
    # on the host rather than at a container the lab started.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./targets/${TARGET_NAME}/target.env
    environment:
      BASE_URL: ${APP_INTERNAL_URL}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-}
      ROLE_A_USER: ${ROLE_A_USER:-}
      ROLE_A_PASS: ${ROLE_A_PASS:-}
      ROLE_B_USER: ${ROLE_B_USER:-}
      ROLE_B_PASS: ${ROLE_B_PASS:-}
    volumes:
      - ./targets/${TARGET_NAME}/k6:/scripts:ro
      # NEVER mount at /lib: that is the container's own library directory. Shadowing it removes
      # the dynamic loader and every binary dies with "no such file or directory" — an error that
      # names the shell, not the mount that broke it.
      - ./lib/k6:/seclab-lib:ro
      - ./reports/${TARGET_NAME}/k6:/reports
    command: ["run", "--summary-export=/reports/summary.json", "/scripts/smoke.js"]

  # ---------- e2e ----------
  # Specs come from two places: lib/specs (generic, every project) and the target's own
  # (business logic). The auth adapter is what makes the generic ones portable.
  playwright:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.49.0-jammy
    network_mode: host
    # The whole target profile is handed to the specs, so a project can read its own variables
    # (a second base URL, a shared secret, a component name) without the core having to learn
    # their names. The explicit block below is only the part of the contract the core relies on.
    env_file:
      - ./targets/${TARGET_NAME}/target.env
    environment:
      BASE_URL: ${BASE_URL}
      FRONTEND_URL: ${FRONTEND_URL:-}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-}
      AUTH_ADAPTER: ${AUTH_ADAPTER:-none}
      ROLE_A_USER: ${ROLE_A_USER:-}
      ROLE_A_PASS: ${ROLE_A_PASS:-}
      ROLE_B_USER: ${ROLE_B_USER:-}
      ROLE_B_PASS: ${ROLE_B_PASS:-}
    volumes:
      - ./targets/${TARGET_NAME}/playwright:/e2e:ro
      # /seclab-lib, not /lib — see the note on the k6 service.
      - ./lib:/seclab-lib:ro
      - ./reports/${TARGET_NAME}/playwright:/reports
    working_dir: /run
    command: >
      sh -c "mkdir -p /run && cp -r /e2e/. /run/ && mkdir -p /run/lib && cp -r /seclab-lib/. /run/lib/ && cd /run &&
             npm init -y >/dev/null 2>&1 &&
             npm i -D @playwright/test@1.49.0 >/dev/null 2>&1 &&
             npx playwright test"

  # ---------- ui ----------
  # Local, single-operator web interface. See ui/app.py for the scope decision.
  #
  # SECURITY INVARIANT: the host side of this mapping is the literal 127.0.0.1 and must never
  # become a variable or 0.0.0.0. This container holds the Docker socket, so whatever reaches
  # the port can start arbitrary containers — root on this host. tools/ui-check-bind.sh verifies
  # it from outside after startup and shuts the UI down if it is ever published wider.
  ui:
    profiles: ["ui"]
    build: ./ui
    # Run as the operator, not as root: this process creates target profiles and report files on
    # a bind mount, and root-owned files there cannot be deleted or edited from the host
    # afterwards. The extra group is the docker socket's, which is what lets a non-root user
    # reach it — it is also, honestly, what makes this container root-equivalent anyway.
    user: "${UI_UID:-1000}:${UI_GID:-1000}"
    group_add:
      - "${DOCKER_GID:-999}"
    ports:
      - "127.0.0.1:${UI_PORT:-7777}:7777"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The lab is mounted at the SAME absolute path it has on the host. The UI shells out to
      # docker compose, but bind mounts are resolved by the host's daemon: if the lab lived at
      # /app in here, the daemon would look for /app/targets/... on the host, find nothing, and
      # silently create an empty directory to mount — analyses would then run over nothing.
      - ${LAB_DIR}:${LAB_DIR}
      # Read-only view of where the audited checkouts live, at their real paths, so the UI can
      # tell whether a SRC_PATH exists and which rung a profile is on. The analysis tools do not
      # need this — their mounts are resolved by the host daemon — only the UI's own checks do.
      # It grants no new privilege: this container already holds the Docker socket, which is
      # root on the host. Defaults to the lab's parent directory; override SRC_MOUNT when your
      # checkouts live somewhere else entirely.
      # The default is never used — `make ui` always sets SRC_MOUNT — but it must be a valid
      # path, because compose parses this whole file for EVERY goal. Without it, the tool goals
      # (which use a target.env that has no SRC_MOUNT) die on "invalid spec: ::ro".
      - ${SRC_MOUNT:-/tmp}:${SRC_MOUNT:-/tmp}:ro
    working_dir: ${LAB_DIR}
    environment:
      LAB_DIR: ${LAB_DIR}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  trivy_cache:
